name: YOU-app
description: YOU-app was a mobile wellbeing application built by Fifth Corner (Helsinki, Finland) that delivered
  daily "micro-actions" across food, mindfulness, movement, and mental wellbeing, blending social-media
  style photo sharing with habit-building and originally aligned to the UN Sustainable Development Goals.
  The company was acquired and is no longer operated as an independent product; the you-app.com domain now
  302-redirects to Hintsa Performance (hintsa.com). No public API, developer portal, documentation, SDKs,
  or machine-readable specification was found during enrichment — this remains a consumer-app profile with
  no developer surface to catalog.
